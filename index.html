<body>
<canvas id="c"></canvas>
<div id="probe" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<script>
'use strict';
// =====================================================================
//  Ролльня — стенд «лист → спираль → срез».
//  Одна модель на всё: плоский лист в координатах (u, v, z).
//    u — направление скрутки: 0 — ближний край (окажется в центре ролла), 1 — дальний (снаружи).
//    v — вдоль оси ролла: какой ломтик.
//    z — слой по толщине намазки: 0 — на обёртке, 1 — верх намазки (внутренняя сторона витка).
//  Начинка — прямоугольный патч на листе с интервалом по z. Стопка вдавливается в намазку сверху
//  (рис под ней сжат с коэффициентом κ): лист скручивается верхом внутрь, поэтому положенное
//  ПОВЕРХ (последним) оказывается ближе к центру ролла, положенное первым — дальше от центра.
//  Скрутка — намотка листа ПЕРЕМЕННОЙ толщины: лист режется на угловые бины и наматывается виток
//  за витком; где стопка толще намазки — слой толще, рис под начинкой выдавлен, ролл бугрится.
//  Единица длины — толщина намазки суши-ролла (≈5 мм); размеры начинок заданы в этих единицах.
//  Срез — попиксельная развёртка: пиксель (r, φ) → виток k → (u, z) → материал.
// =====================================================================

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const remap = (t, a, b) => clamp((t - a) / (b - a));
const fract = x => x - Math.floor(x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbCss = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
function hash(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- данные
const BASES = {
  sushi: { name: 'Суши-ролл', emoji: '🍣', wrapper: '#22342b', spread: '#f4ecda', mat: '#c9a96c', matLine: '#b28f56',
    T: 1.4, w: 0.02, sheetCm: 21, turns: 3.1, kappa: 0.85, spreadEnd: 1.0, beta: 0.55, oneTurn: true, flap: 0, tuckMin: 5, Wv: 38,
    ingredients: ['salmon', 'cucumber', 'tamago', 'avocado', 'shrimp', 'nori', 'mayo', 'eggsheet', 'ricePink', 'riceYellow', 'riceGreen', 'riceBlack'] },
  cake:  { name: 'Рулет', emoji: '🍰', wrapper: '#d8a05c', spread: '#fff8ef', mat: '#ece2d2', matLine: '#dfd3c0',
    T: 1.0, w: 1.7, turns: 2.5, kappa: 0.5, spreadEnd: 0.95, beta: 0.7, Wv: 40,
    ingredients: ['strawberry', 'kiwi', 'banana', 'mango', 'choco', 'jam', 'nut', 'pinkcream'] },
  // Лаваш-ролл: тонкая обёртка спиралью в 4–5 оборотов — у него нори-подобная линия внутри настоящая
  lavash: { name: 'Лаваш-ролл', emoji: '🌯', wrapper: '#dcbf87', spread: '#f7f1e6', mat: '#b98f5a', matLine: '#a67c48',
    T: 0.45, w: 0.4, turns: 4.5, kappa: 0.7, spreadEnd: 0.96, beta: 0.6, Wv: 40,
    ingredients: ['salmon', 'cucumber', 'cheese', 'tomato', 'pepper', 'ham', 'lettuce', 'eggsheet', 'dill'] },
};
const R0 = 0.25;   // радиус сердцевины
// Длина листа. Лист — физический продукт с известным размером (лист нори 19x21 см, лаваш, противень),
// поэтому если у базы задан sheetCm — он и есть источник, а число витков из него ВЫВОДИТСЯ.
// Обратный порядок (витки → длина) остаётся запасным для баз без замера и опирается на угаданный turns,
// из-за чего ошибка в толщине листа w молча уезжала в длину листа. См. sim/KINEMATICS.md.
const U_MM = 5;    // одна единица модели = 5 мм
function turnsFor(L, P0) { // сколько витков даст лист длины L при шаге P0 (спираль Архимеда, обратная sheetLen)
  return (Math.sqrt(R0 * R0 + 2 * P0 * L / TAU) - R0) / P0;
}
for (const k in BASES) {
  const b = BASES[k], P0 = b.T + b.w;
  if (b.sheetCm) { b.L = b.sheetCm * 10 / U_MM; b.turns = turnsFor(b.L, P0); }
  else { const th = TAU * b.turns; b.L = R0 * th + P0 * th * th / (2 * TAU); }
}
// wU — ширина вдоль u, hU — высота; обе в единицах (толщина риса ≈ 5 мм). dv — доля длины ролла.
//
// НАРЕЗКА (cut) — главное, что задаёт форму на срезе. Не «как нарисовать красиво», а как повар режет:
//   'брусок'   — прямоугольное сечение: тамаго, лосось, огурец для каппамаки, сыр
//   'кружок'   — круглое: креветка, клубника целиком, банан; обычно короткие (dv < 1) — видны не во всех кусочках
//   'ломтик'   — полумесяц: авокадо, помидор, манго — режут наискось, сечение линзой
//   'лист'     — очень широкий и тонкий: салат, омлет-лист, нори, ветчина
//   'паста'    — тонкая линия, в жизни вдавливается в рис: майо, джем, шоколад (см. sim/KINEMATICS.md)
//   'присыпка' — заполняет поры, своей формы не держит: укроп, цветной рис
// round и lens — производные от cut, оставлены для быстрой проверки в matAt.
const ING = {
  salmon:     { name: 'Лосось',   color: '#ef8a66', wU: 2.0, hU: 1.6, dv: 1.00, tex: 'salmon', cut: 'брусок' },
  cucumber:   { name: 'Огурец',   color: '#79b55c', wU: 1.4, hU: 1.6, dv: 1.00, tex: 'cucumber', cut: 'брусок' },
  tamago:     { name: 'Тамаго',   color: '#f3c94f', wU: 2.4, hU: 2.0, dv: 1.00, tex: 'tamago', cut: 'брусок' },
  avocado:    { name: 'Авокадо',  color: '#a7c455', wU: 2.0, hU: 1.1, dv: 1.00, tex: 'avocado', cut: 'ломтик', lens: true },
  shrimp:     { name: 'Креветка', color: '#f4a48c', wU: 2.0, hU: 1.6, dv: 0.30, tex: 'shrimp', cut: 'кружок', round: true },
  nori:       { name: 'Нори',     color: '#22342b', wU: 2.4, hU: 0.15, dv: 1.00, tex: 'flat', cut: 'лист' },
  mayo:       { name: 'Майо',     color: '#f2883f', wU: 0.8, hU: 0.5, dv: 1.00, tex: 'gloss', wave: { amp: 0.05, freq: 3 }, cut: 'паста', round: true },
  eggsheet:   { name: 'Омлет', color: '#f6d97a', wU: 10, hU: 0.35, dv: 1.00, tex: 'tamago', cut: 'лист' },
  ricePink:   { name: 'Розовый', color: '#f2b3c2', wU: 4, hU: 1.0, dv: 1.00, tex: 'rice', paint: true, cut: 'присыпка' },
  riceYellow: { name: 'Жёлтый', color: '#f0d27a', wU: 4, hU: 1.0, dv: 1.00, tex: 'rice', paint: true, cut: 'присыпка' },
  riceGreen:  { name: 'Зелёный', color: '#b7cf86', wU: 4, hU: 1.0, dv: 1.00, tex: 'rice', paint: true, cut: 'присыпка' },
  riceBlack:  { name: 'Чёрный', color: '#4a4440', wU: 4, hU: 1.0, dv: 1.00, tex: 'rice', paint: true, cut: 'присыпка' },
  cheese:     { name: 'Сыр',      color: '#f2dc8a', wU: 2.2, hU: 1.2, dv: 1.00, tex: 'cheese', cut: 'брусок' },
  tomato:     { name: 'Помидор',  color: '#e04a3a', wU: 2.6, hU: 1.0, dv: 1.00, tex: 'tomato', cut: 'ломтик', lens: true },
  pepper:     { name: 'Перец',    color: '#d8432e', wU: 1.4, hU: 0.9, dv: 1.00, tex: 'pepper', cut: 'брусок' },
  ham:        { name: 'Ветчина',  color: '#e9a0a8', wU: 3.0, hU: 0.6, dv: 1.00, tex: 'ham', cut: 'лист' },
  lettuce:    { name: 'Салат',    color: '#9ccc6a', wU: 8, hU: 0.3, dv: 1.00, tex: 'lettuce', cut: 'лист' },
  dill:       { name: 'Укроп',    color: '#8fb86a', wU: 6, hU: 1.0, dv: 1.00, tex: 'dill', paint: true, cut: 'присыпка' },
  pinkcream:  { name: 'Роз. крем', color: '#f4a6c0', wU: 10, hU: 0.35, dv: 1.00, tex: 'flat', cut: 'лист' },
  // Пока — ломтиками плашмя, как киви: срез видит их РЕБРОМ, красной полосой 25×5 мм.
  // Целая ягода — конус, а модель держит одно сечение на всю длину начинки; до появления
  // профиля вдоль оси целые ягоды рисовались бы «колбасой». См. docs/ideas.md, отложенный пункт.
  strawberry: { name: 'Клубника', color: '#e0364a', wU: 5.0, hU: 1.0, dv: 0.125, tex: 'berryEdge', cut: 'ломтик' },
  // Киви режут кружками и кладут ПЛАШМЯ: срез проходит поперёк ломтика и видит его РЕБРОМ —
  // зелёную полосу со светлой сердцевиной, а не лицо с семечками. Лицо появилось бы, только если
  // поставить ломтик на ребро (вариант «стоймя» — кандидат в выбор нарезки, см. docs/ideas.md).
  kiwi:       { name: 'Киви',     color: '#8dbf4c', wU: 9.0, hU: 1.2, dv: 0.225, tex: 'kiwiEdge', cut: 'ломтик' },
  // Банан кладут целым вдоль всего ролла: ⌀ 32 мм, круглое сечение в каждом кусочке.
  banana:     { name: 'Банан',    color: '#f3e3a0', wU: 6.4, hU: 6.4, dv: 1.00, tex: 'banana', cut: 'кружок', round: true },
  mango:      { name: 'Манго',    color: '#f6b02f', wU: 8.0, hU: 1.6, dv: 1.00, tex: 'mango', cut: 'ломтик', lens: true },
  choco:      { name: 'Шоколад',  color: '#47291b', wU: 0.9, hU: 0.5, dv: 1.00, tex: 'gloss', wave: { amp: 0.05, freq: 2.5 }, cut: 'паста', round: true },
  jam:        { name: 'Джем',     color: '#b0203e', wU: 3.5, hU: 0.35, dv: 1.00, tex: 'gloss', cut: 'паста' },
  nut:        { name: 'Орех',     color: '#b5793f', wU: 1.2, hU: 1.0, dv: 0.12, tex: 'nut', cut: 'кружок', round: true },
};
for (const k in ING) ING[k].rgb = hexRgb(ING[k].color);
for (const k in BASES) { BASES[k].wrapperRgb = hexRgb(BASES[k].wrapper); BASES[k].spreadRgb = hexRgb(BASES[k].spread); }

// ---------------------------------------------------------------- состояние
const S = {
  mode: 'lay',                 // lay | rolled | cut | revealed | slicing | plate
  base: 'sushi',
  lists: { sushi: [], cake: [], lavash: [] },
  sel: 'salmon',
  preview: false,
  mute: false,
  cuts: 0,                     // срезов за сессию — замер 1
  cutsTotal: 0,
  rollP: 0,                    // прогресс скрутки 0..1 (в режиме lay)
  bigPiece: -1,
  selPatch: null,              // выделенная начинка на листе
  // «Почерк»: как игрок тянул циновку. air — воздух между витками (быстрая тяга),
  // wobble — неравномерность толщины по длине (рывки), press — множитель прижима (удержание в конце).
  // Нейтральные значения {0, 0, 1} дают ровно ту же намотку, что и раньше.
  hand: { air: 0, wobble: 0, phase: 0, press: 1, v: 1, cv: 0, hold: 0 },
  turns: null,                 // число витков (пазл задаёт длину листа); null — по базе
  shape: 'round',              // форма прессовки: round | square | triangle
  puzzle: null,                // режим «Пазл»: { level, seed, target, vs, result }
  album: [],                   // сохранённые роллы: рецепт + почерк, картинки пересчитываются
  albumOpen: -1,               // раскрытая запись альбома
  albumScroll: 0,
  saved: 0,                    // время подсветки «сохранено»
};
const patches = () => S.lists[S.base];
const B = () => BASES[S.base];
const NPIECES = 6;

function load() {
  try {
    const m = JSON.parse(localStorage.getItem('rollery.model.v2') || 'null');
    if (m && m.lists) { S.base = m.base in BASES ? m.base : 'sushi'; S.lists = m.lists; }
    for (const k in BASES) if (!S.lists[k]) S.lists[k] = [];
    S.preview = localStorage.getItem('rollery.preview') === '1';
    S.mute = localStorage.getItem('rollery.mute') === '1';
    S.shape = localStorage.getItem('rollery.shape') || 'round';
    S.cutsTotal = +(localStorage.getItem('rollery.cuts') || 0);
    S.album = JSON.parse(localStorage.getItem('rollery.album') || '[]');
    if (!Array.isArray(S.album)) S.album = [];
  } catch (e) {}
  S.sel = B().ingredients[0];
  for (const b in S.lists) S.lists[b] = S.lists[b].filter(p => ING[p.kind]);
}
function save() {
  try {
    localStorage.setItem('rollery.model.v2', JSON.stringify({ base: S.base, lists: S.lists }));
    localStorage.setItem('rollery.preview', S.preview ? '1' : '0');
    localStorage.setItem('rollery.mute', S.mute ? '1' : '0');
    localStorage.setItem('rollery.shape', S.shape);
    localStorage.setItem('rollery.cuts', String(S.cutsTotal));
  } catch (e) {}
}

// ---------------------------------------------------------------- модель листа
// Размеры патча: у обёрточных нори-патчей размеры и высота переопределены под начинку.
function sheetLen(b) { if (!S.turns) return b.L; const P0 = b.T + b.w, th = TAU * S.turns; return R0 * th + P0 * th * th / (2 * TAU); }
function dims(p) { const d = ING[p.kind], b = B(); return { du: (p.wU ?? d.wU) / sheetLen(b), dv: p.dv ?? d.dv, h: (p.hU ?? d.hU) / b.T }; }
// Патч может лежать под углом rot к оси ролла: 0 — вдоль, 90° — поперёк, 45° — по диагонали.
// Тогда в каждом ломтике он оказывается на другом месте листа — рисунок меняется от кусочка к кусочку.
function bounds(p) {
  const d = ING[p.kind], m = dims(p), b = B(), amp = d.wave ? d.wave.amp : 0, rot = p.rot || 0, c = Math.abs(Math.cos(rot)), sn = Math.abs(Math.sin(rot));
  const w = m.du * sheetLen(b), len = m.dv * b.Wv, hu = (w * c + len * sn) / 2 / sheetLen(b), hv = (w * sn + len * c) / 2 / b.Wv;
  return { u0: p.u - hu - amp, u1: p.u + hu + amp, v0: p.v - hv, v1: p.v + hv };
}
// Отрезок листа (в единицах длины, вдоль u), который патч занимает в ломтике v; null — патча в этом ломтике нет.
function patchSRange(p, v) {
  const d = ING[p.kind], m = dims(p), b = B(), L = sheetLen(b), rot = p.rot || 0, c = Math.cos(rot), sn = Math.sin(rot);
  const w = m.du * L, len = m.dv * b.Wv, dv_ = (v - p.v) * b.Wv;
  let lo = -1e9, hi = 1e9;
  if (Math.abs(c) > 1e-6) { const a = (-w / 2 - dv_ * sn) / c, e = (w / 2 - dv_ * sn) / c; lo = Math.max(lo, Math.min(a, e)); hi = Math.min(hi, Math.max(a, e)); }
  else if (Math.abs(dv_) > w / 2) return null;
  if (Math.abs(sn) > 1e-6) { const a = (dv_ * c - len / 2) / sn, e = (dv_ * c + len / 2) / sn; lo = Math.max(lo, Math.min(a, e)); hi = Math.min(hi, Math.max(a, e)); }
  else if (Math.abs(dv_) > len / 2) return null;
  if (hi <= lo) return null;
  let uc = p.u; if (d.wave) uc += d.wave.amp * Math.sin(TAU * d.wave.freq * v + p.phase);
  return [uc * L + lo, uc * L + hi, uc, w, len, c, sn, dv_];
}
function overlap(a, b) {
  const A = bounds(a), Bb = bounds(b);
  return A.u0 < Bb.u1 && Bb.u0 < A.u1 && A.v0 < Bb.v1 && Bb.v0 < A.v1;
}
// Стопка: что положено позже, лежит выше. Стопка вдавлена в намазку сверху: её верх — на поверхности
// намазки (z=1), пока стопка не выше намазки; выше — торчит и утолщает ролл.
// Возвращает верх намазки в долях её толщины (≥1).
function restack(list) {
  const n = list.length, adj = list.map(() => []), paint = list.map(p => !!ING[p.kind].paint);
  for (let i = 0; i < n; i++) for (let j = 0; j < i; j++) if (!paint[i] && !paint[j] && overlap(list[i], list[j])) { adj[i].push(j); adj[j].push(i); }
  for (let i = 0; i < n; i++) {
    const p = list[i]; let base = 0;
    for (const j of adj[i]) if (j < i) base = Math.max(base, list[j].z1);
    p.z0 = base; p.z1 = base + dims(p).h;
  }
  const seen = new Array(n).fill(false); let top = 1;
  for (let i = 0; i < n; i++) {
    if (paint[i]) { list[i].z0 = 0; list[i].z1 = 1; seen[i] = true; continue; }   // краска: вся толщина намазки, не бугрит
    if (seen[i]) continue;
    const comp = [i]; seen[i] = true;
    for (let k = 0; k < comp.length; k++) for (const j of adj[comp[k]]) if (!seen[j]) { seen[j] = true; comp.push(j); }
    let ctop = 0; for (const k of comp) ctop = Math.max(ctop, list[k].z1);
    const shift = Math.max(0, 1 - B().kappa * ctop);   // рис под стопкой сжат частично (κ), не выдавлен целиком
    for (const k of comp) { list[k].z0 += shift; list[k].z1 += shift; top = Math.max(top, list[k].z1); }
  }
  return top;
}
// Какой материал лежит в точке листа (u, v, z). null — намазка.
function matAt(u, v, z, list) {
  const L = sheetLen(B());
  for (let pass = 0; pass < 2; pass++) for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i], d = ING[p.kind];
    if (p.inCore || !!d.paint !== (pass === 1)) continue;
    if (!d.paint && (z < p.z0 || z > p.z1)) continue;
    const rg = patchSRange(p, v); if (!rg) continue;
    const sU = u * L; if (sU < rg[0] || sU > rg[1]) continue;
    const du_ = sU - rg[2] * L, across = du_ * rg[5] + rg[7] * rg[6], along = -du_ * rg[6] + rg[7] * rg[5];
    const lu = across / rg[3];
