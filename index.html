<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  Ролльня — стенд «лист → спираль → срез».
//  Одна модель на всё: плоский лист в координатах (u, v, z).
//    u — направление скрутки: 0 — ближний край (окажется в центре ролла), 1 — дальний (снаружи).
//    v — вдоль оси ролла: какой ломтик.
//    z — слой по толщине намазки: 0 — на обёртке, 1 — верх намазки (внутренняя сторона витка).
//  Начинка — прямоугольный патч на листе с интервалом по z. Стопка вдавливается в намазку сверху:
//  первая положенная начинка — ближе к центру ролла, положенная поверх неё — дальше от центра.
//  Скрутка — намотка листа ПЕРЕМЕННОЙ толщины: лист режется на угловые бины и наматывается виток
//  за витком; где стопка толще намазки — слой толще, рис под начинкой выдавлен, ролл бугрится.
//  Единица длины — толщина намазки суши-ролла (≈5 мм); размеры начинок заданы в этих единицах.
//  Срез — попиксельная развёртка: пиксель (r, φ) → виток k → (u, z) → материал.
// =====================================================================

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const remap = (t, a, b) => clamp((t - a) / (b - a));
const fract = x => x - Math.floor(x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbCss = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
function hash(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- данные
const BASES = {
  sushi: { name: 'Суши-ролл', emoji: '🍣', wrapper: '#22342b', spread: '#f4ecda', mat: '#c9a96c', matLine: '#b28f56',
    T: 1.0, w: 0.12, turns: 3.1, ingredients: ['salmon', 'cucumber', 'tamago', 'avocado', 'shrimp', 'nori', 'mayo', 'eggsheet'] },
  cake:  { name: 'Рулет', emoji: '🍰', wrapper: '#d8a05c', spread: '#fff8ef', mat: '#ece2d2', matLine: '#dfd3c0',
    T: 0.8, w: 0.42, turns: 2.7, ingredients: ['strawberry', 'kiwi', 'banana', 'mango', 'choco', 'jam', 'nut', 'pinkcream'] },
};
const R0 = 0.25;   // радиус сердцевины
// Длина листа базы — из номинального числа витков пустого листа (спираль Архимеда с шагом T + w).
for (const k in BASES) { const b = BASES[k], P0 = b.T + b.w, th = TAU * b.turns; b.L = R0 * th + P0 * th * th / (2 * TAU); }
// wU — ширина вдоль u, hU — высота; обе в единицах (толщина риса ≈ 5 мм). dv — доля длины ролла. round — круглое сечение.
const ING = {
  salmon:     { name: 'Лосось',   color: '#ef8a66', wU: 2.0, hU: 1.6, dv: 1.00, tex: 'salmon' },
  cucumber:   { name: 'Огурец',   color: '#79b55c', wU: 1.4, hU: 1.4, dv: 1.00, tex: 'cucumber', round: true },
  tamago:     { name: 'Тамаго',   color: '#f3c94f', wU: 2.4, hU: 2.0, dv: 1.00, tex: 'tamago' },
  avocado:    { name: 'Авокадо',  color: '#a7c455', wU: 2.0, hU: 1.1, dv: 1.00, tex: 'avocado', round: true },
  shrimp:     { name: 'Креветка', color: '#f4a48c', wU: 2.0, hU: 1.6, dv: 0.30, tex: 'shrimp', round: true },
  nori:       { name: 'Нори',     color: '#22342b', wU: 2.4, hU: 0.15, dv: 1.00, tex: 'flat' },
  mayo:       { name: 'Майо',     color: '#f2883f', wU: 0.8, hU: 0.5, dv: 1.00, tex: 'gloss', round: true, wave: { amp: 0.05, freq: 3 } },
  eggsheet:   { name: 'Омлет-лист', color: '#f6d97a', wU: 10, hU: 0.35, dv: 1.00, tex: 'tamago' },
  pinkcream:  { name: 'Крем-роза', color: '#f4a6c0', wU: 10, hU: 0.35, dv: 1.00, tex: 'flat' },
  strawberry: { name: 'Клубника', color: '#e0364a', wU: 2.6, hU: 2.4, dv: 0.22, tex: 'strawberry', round: true },
  kiwi:       { name: 'Киви',     color: '#8dbf4c', wU: 3.0, hU: 2.6, dv: 0.20, tex: 'kiwi', round: true },
  banana:     { name: 'Банан',    color: '#f3e3a0', wU: 2.4, hU: 2.0, dv: 1.00, tex: 'banana', round: true },
  mango:      { name: 'Манго',    color: '#f6b02f', wU: 2.2, hU: 1.6, dv: 1.00, tex: 'mango', round: true },
  choco:      { name: 'Шоколад',  color: '#47291b', wU: 0.9, hU: 0.5, dv: 1.00, tex: 'gloss', round: true, wave: { amp: 0.05, freq: 2.5 } },
  jam:        { name: 'Джем',     color: '#b0203e', wU: 3.5, hU: 0.35, dv: 1.00, tex: 'gloss' },
  nut:        { name: 'Орех',     color: '#b5793f', wU: 1.2, hU: 1.0, dv: 0.12, tex: 'nut', round: true },
};
for (const k in ING) ING[k].rgb = hexRgb(ING[k].color);
for (const k in BASES) { BASES[k].wrapperRgb = hexRgb(BASES[k].wrapper); BASES[k].spreadRgb = hexRgb(BASES[k].spread); }

// ---------------------------------------------------------------- состояние
const S = {
  mode: 'lay',                 // lay | rolled | cut | revealed | slicing | plate
  base: 'sushi',
  lists: { sushi: [], cake: [] },
  sel: 'salmon',
  preview: false,
  mute: false,
  cuts: 0,                     // срезов за сессию — замер 1
  cutsTotal: 0,
  rollP: 0,                    // прогресс скрутки 0..1 (в режиме lay)
  bigPiece: -1,
  selPatch: null,              // выделенная начинка на листе
};
const patches = () => S.lists[S.base];
const B = () => BASES[S.base];
const NPIECES = 6;

function load() {
  try {
    const m = JSON.parse(localStorage.getItem('rollery.model.v2') || 'null');
    if (m && m.lists) { S.base = m.base in BASES ? m.base : 'sushi'; S.lists = m.lists; }
    S.preview = localStorage.getItem('rollery.preview') === '1';
    S.mute = localStorage.getItem('rollery.mute') === '1';
    S.cutsTotal = +(localStorage.getItem('rollery.cuts') || 0);
  } catch (e) {}
  S.sel = B().ingredients[0];
  for (const b in S.lists) S.lists[b] = S.lists[b].filter(p => ING[p.kind]);
}
function save() {
  try {
    localStorage.setItem('rollery.model.v2', JSON.stringify({ base: S.base, lists: S.lists }));
    localStorage.setItem('rollery.preview', S.preview ? '1' : '0');
    localStorage.setItem('rollery.mute', S.mute ? '1' : '0');
    localStorage.setItem('rollery.cuts', String(S.cutsTotal));
  } catch (e) {}
}

// ---------------------------------------------------------------- модель листа
// Размеры патча: у обёрточных нори-патчей размеры и высота переопределены под начинку.
function dims(p) { const d = ING[p.kind], b = B(); return { du: (p.wU ?? d.wU) / b.L, dv: p.dv ?? d.dv, h: (p.hU ?? d.hU) / b.T }; }
function bounds(p) {
  const d = ING[p.kind], m = dims(p), amp = d.wave ? d.wave.amp : 0;
  return { u0: p.u - m.du / 2 - amp, u1: p.u + m.du / 2 + amp, v0: p.v - m.dv / 2, v1: p.v + m.dv / 2 };
}
function overlap(a, b) {
  const A = bounds(a), Bb = bounds(b);
  return A.u0 < Bb.u1 && Bb.u0 < A.u1 && A.v0 < Bb.v1 && Bb.v0 < A.v1;
}
// Стопка: что положено позже, лежит выше. Стопка вдавлена в намазку сверху: её верх — на поверхности
// намазки (z=1), пока стопка не выше намазки; выше — торчит и утолщает ролл.
// Возвращает верх намазки в долях её толщины (≥1).
function restack(list) {
  const n = list.length, adj = list.map(() => []);
  for (let i = 0; i < n; i++) for (let j = 0; j < i; j++) if (overlap(list[i], list[j])) { adj[i].push(j); adj[j].push(i); }
  for (let i = 0; i < n; i++) {
    const p = list[i]; let base = 0;
    for (const j of adj[i]) if (j < i) base = Math.max(base, list[j].z1);
    p.z0 = base; p.z1 = base + dims(p).h;
  }
  const seen = new Array(n).fill(false); let top = 1;
  for (let i = 0; i < n; i++) {
    if (seen[i]) continue;
    const comp = [i]; seen[i] = true;
    for (let k = 0; k < comp.length; k++) for (const j of adj[comp[k]]) if (!seen[j]) { seen[j] = true; comp.push(j); }
    let ctop = 0; for (const k of comp) ctop = Math.max(ctop, list[k].z1);
    const shift = Math.max(0, 1 - ctop);
    for (const k of comp) { list[k].z0 += shift; list[k].z1 += shift; top = Math.max(top, list[k].z1); }
  }
  return top;
}
// Какой материал лежит в точке листа (u, v, z). null — намазка.
function matAt(u, v, z, list) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i], d = ING[p.kind], m = dims(p);
    if (z < p.z0 || z > p.z1) continue;
    if (v < p.v - m.dv / 2 || v > p.v + m.dv / 2) continue;
    let uc = p.u;
    if (d.wave) uc += d.wave.amp * Math.sin(TAU * d.wave.freq * v + p.phase);
    const lu = (u - uc) / m.du;
    if (lu < -0.5 || lu > 0.5) continue;
    const lz = (z - p.z0) / (p.z1 - p.z0);
    if (d.round) { const a = lu * 2, b = lz * 2 - 1; if (a * a + b * b > 1) continue; }
    return { p, d, lu, lz, lv: (v - p.v) / m.dv };
  }
  return null;
}
// Геометрия. Единица длины — толщина намазки суши-ролла.
function geometry() { const b = B(); restack(patches()); return { T: b.T, w: b.w, r0: R0, L: b.L }; }
const NB = 1440, DPHI = TAU / NB, KMAX = 9;
function covers(p, u, v) {
  const d = ING[p.kind], m = dims(p);
  if (v < p.v - m.dv / 2 || v > p.v + m.dv / 2) return false;
  let uc = p.u; if (d.wave) uc += d.wave.amp * Math.sin(TAU * d.wave.freq * v + p.phase);
  return Math.abs(u - uc) <= m.du / 2;
}
// Толщина «намазка + стопка» в точке листа (без обёртки), в единицах: рис под начинкой выдавлен, когда стопка выше намазки.
function bandAt(u, v, g, list) { let H = 0; for (const p of list) if (covers(p, u, v)) H = Math.max(H, p.z1); return Math.max(1, H) * g.T; }
// Намотка листа переменной толщины: по угловым бинам, виток за витком. sMax — сколько листа съедено (для анимации скрутки).
const PROF_DS = 0.02, SMOOTH_R = 0.6;   // шаг профиля толщины и радиус сглаживания (единицы ≈ 5 мм)
// Профиль толщины листа вдоль u, сглаженный: лист и рис не дают бугру быть уступом.
function thicknessProfile(vSlice, g, list) {
  const M = Math.ceil(g.L / PROF_DS) + 2; let a = new Float32Array(M), tmp = new Float32Array(M);
  for (let i = 0; i < M; i++) a[i] = bandAt(Math.min(1, i * PROF_DS / g.L), vSlice, g, list);
  const R = Math.max(1, Math.round(SMOOTH_R / PROF_DS));
  for (let pass = 0; pass < 2; pass++) {              // два прохода box-blur ≈ гаусс
    let acc = 0; for (let i = -R; i <= R; i++) acc += a[Math.min(M - 1, Math.max(0, i))];
    for (let i = 0; i < M; i++) { tmp[i] = acc / (2 * R + 1); acc += a[Math.min(M - 1, i + R + 1)] - a[Math.max(0, i - R)]; }
    const sw = a; a = tmp; tmp = sw;
  }
  return a;
}
function wind(vSlice, sMax, g, list) {
  const n = KMAX * NB, rin = new Float32Array(n).fill(-1), rout = new Float32Array(n), u0 = new Float32Array(n), u1 = new Float32Array(n);
  const top = new Float32Array(NB).fill(g.r0), prof = thicknessProfile(vSlice, g, list);
  let s = 0, k = 0, b = 0, phiEnd = -1, lastIdx = -1, Rout = g.r0, bins = 0;
  while (s < sMax && k < KMAX) {
    const idx = k * NB + b, u = s / g.L;
    const t = prof[Math.min(prof.length - 1, Math.round(s / PROF_DS))] + g.w, ri = top[b], rm = ri + t / 2, ds = rm * DPHI;
    rin[idx] = ri; rout[idx] = ri + t; u0[idx] = u; top[b] = ri + t; if (ri + t > Rout) Rout = ri + t; bins++;
    if (s + ds >= sMax) { u1[idx] = sMax / g.L; phiEnd = b * DPHI + (sMax - s) / rm; lastIdx = idx; s = sMax; break; }
    s += ds; u1[idx] = s / g.L;
    if (++b === NB) { b = 0; k++; }
  }
  return { rin, rout, u0, u1, top, Rout, lastIdx, phiEnd, kmax: Math.min(KMAX, k + 1), turns: bins / NB };
}
// Пиксель среза (r, φ) → на каком витке и где на листе. null — вне листа.
function sampleWind(wd, r, phi) {
  const fb = phi / DPHI; let b = Math.floor(fb); if (b >= NB) b = NB - 1; const frac = fb - b;
  for (let k = 0; k < wd.kmax; k++) {
    const idx = k * NB + b, ri = wd.rin[idx]; if (ri < 0) break;
    const ro = wd.rout[idx]; let ri2 = ri, ro2 = ro, f = frac;
    if (idx === wd.lastIdx) { const fe = (wd.phiEnd - b * DPHI) / DPHI; if (frac > fe) continue; f = fe > 1e-6 ? frac / fe : 0; }
    else { const nidx = b + 1 < NB ? idx + 1 : (k + 1) * NB; if (nidx < wd.rin.length && wd.rin[nidx] >= 0) { ri2 = wd.rin[nidx]; ro2 = wd.rout[nidx]; } }
    const rIn = ri + (ri2 - ri) * f, rOut = ro + (ro2 - ro) * f;
    if (r >= rIn && r < rOut) return { u: wd.u0[idx] + (wd.u1[idx] - wd.u0[idx]) * f, zr: r - rIn, t: rOut - rIn, rOut };
  }
  return null;
}
function topAt(wd, phi) { const fb = phi / DPHI; let b = Math.floor(fb); if (b >= NB) b = NB - 1; const f = fb - b, b2 = (b + 1) % NB; return wd.top[b] + (wd.top[b2] - wd.top[b]) * f; }
// Кэш намоток текущей модели: срезы посередине и по кусочкам; общий масштаб — по максимальному радиусу.
const modelCache = { key: null, g: null, wds: new Map(), Rmax: 0 };
function getModel() {
  if (modelCache.key === modelKey && modelCache.g) return modelCache;
  const g = geometry(), list = patches();
  modelCache.key = modelKey; modelCache.g = g; modelCache.wds.clear();
  const vs = [0.5]; for (let i = 0; i < NPIECES; i++) vs.push(pieceV(i));
  let Rmax = 0; for (const v of vs) { const wd = wind(v, g.L, g, list); modelCache.wds.set(v.toFixed(4), wd); Rmax = Math.max(Rmax, wd.Rout); }
  modelCache.Rmax = Rmax; return modelCache;
}
function windFor(v) { const m = getModel(), key = v.toFixed(4); let wd = m.wds.get(key); if (!wd) { wd = wind(v, m.g.L, m.g, patches()); m.wds.set(key, wd); } return wd; }

// ---------------------------------------------------------------- цвета материалов на срезе
function spreadColor(px, py, b) {
  const c = b.spreadRgb;
  if (S.base === 'sushi') {
    const n1 = hash(px >> 1, py >> 1), n2 = hash(px >> 2, (py >> 2) + 77);
    let t = (n1 - 0.5) * 10 + (n2 - 0.5) * 16; if (n1 > 0.965) t -= 24;
    return [c[0] + t, c[1] + t, c[2] + t * 0.6];
  }
  const t = (hash(px, py) - 0.5) * 4;
  return [c[0] + t, c[1] + t, c[2] + t];
}
function wrapperColor(px, py, b) {
  const c = b.wrapperRgb, n = hash(px, py + 999);
  let t = (n - 0.5) * 8; if (S.base === 'cake' && n > 0.9) t -= 20;
  return [c[0] + t, c[1] + t, c[2] + t];
}
function patchColor(m, px, py) {
  const { d, lu, lz, lv } = m, c = d.rgb;
  const dd = Math.hypot(lu * 2, lz * 2 - 1);
  switch (d.tex) {
    case 'salmon': { const s = fract(lu * 5.5 + lz * 0.7 + m.p.phase * 0.3); return mix(c, [255, 246, 236], s < 0.13 ? 0.55 : 0); }
    case 'cucumber': { if (dd > 0.84) return [86, 138, 60]; if (dd < 0.35 && hash(px, py) > 0.93) return [196, 200, 146]; return mix([214, 232, 178], c, smooth(0.2, 0.84, dd)); }
    case 'tamago': return mix(c, [200, 150, 50], fract(lz * 3.5) < 0.12 ? 0.18 : 0);
    case 'avocado': return mix([226, 224, 140], [104, 150, 60], smooth(0.15, 1, dd));
    case 'shrimp': return fract(lu * 3 + lv * 2 + 0.2) < 0.45 ? [250, 236, 224] : c;
    case 'gloss': return mix(c, [255, 255, 255], lz > 0.72 ? 0.25 : 0);
    case 'strawberry': { if (dd > 0.5 && hash(px, py) > 0.92) return [248, 230, 120]; return mix([255, 236, 236], c, smooth(0.15, 0.75, dd)); }
    case 'kiwi': { if (dd > 0.92) return [110, 90, 60]; if (dd > 0.38 && dd < 0.56 && hash(px, py) > 0.85) return [30, 25, 20]; return mix([236, 240, 190], c, smooth(0.1, 0.7, dd)); }
    case 'banana': { if (dd < 0.25 && hash(px, py) > 0.9) return [150, 120, 80]; return mix([250, 240, 200], c, dd); }
    case 'mango': return mix(c, [255, 214, 120], fract(lu * 4 + lz) < 0.2 ? 0.25 : 0);
    case 'nut': return mix([220, 180, 120], c, dd);
    default: return c;
  }
}

// ---------------------------------------------------------------- рендер среза
// size — в пикселях устройства; vSlice — где режем. Возвращает canvas с прозрачным фоном.
function renderSection(size, vSlice) {
  const m = getModel(), g = m.g, b = B(), list = patches(), wd = windFor(vSlice);
  const off = document.createElement('canvas'); off.width = off.height = size;
  const c = off.getContext('2d'); const img = c.createImageData(size, size); const d = img.data;
  const half = size / 2, scale = (half - 1.5) / m.Rmax;
  for (let py = 0; py < size; py++) for (let px = 0; px < size; px++) {
    const i = (py * size + px) * 4;
    const dx = (px + 0.5 - half) / scale, dy = (py + 0.5 - half) / scale;
    const r = Math.hypot(dx, dy);
    if (r > wd.Rout + 1 / scale) { d[i + 3] = 0; continue; }
    let phi = Math.atan2(dy, dx); if (phi < 0) phi += TAU;
    let alpha = 1, rgb;
    const sm = r < g.r0 ? null : sampleWind(wd, r, phi);
    if (sm) {
      const zn = (sm.t - g.w - sm.zr) / g.T;                 // z в долях намазки; < 0 — обёртка
      if (zn < 0) rgb = wrapperColor(px, py, b);
      else { const mt = matAt(sm.u, vSlice, zn, list); rgb = mt ? patchColor(mt, px, py) : spreadColor(px, py, b); }

  ctx.save(); rr(s.x, s.y, s.w, s.h, 4); ctx.clip(); ctx.drawImage(getSpreadTex(s.w, s.h), s.x, s.y, s.w, s.h); ctx.restore();
  for (const pt of patches()) if (pt !== drag.patch) drawPatchTop(pt);
  if (drag.patch) drawPatchTop(drag.patch, 0.85);
  const sel = S.selPatch && patches().includes(S.selPatch) ? S.selPatch : (S.selPatch = null);
  if (sel && p === 0) {
    const r = patchRect(sel), d = ING[sel.kind]; if (d.wave) { r.y -= d.wave.amp * s.h; r.h += 2 * d.wave.amp * s.h; }
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; rr(r.x - 5, r.y - 5, r.w + 10, r.h + 10, 8); ctx.stroke(); ctx.setLineDash([]);
  }
  if (S.preview && p === 0) { ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(40,30,20,0.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(s.x + s.w / 2, s.y); ctx.lineTo(s.x + s.w / 2, s.y + s.h); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
  // ролл в процессе скрутки
  if (p > 0) { const R = wind(0.5, p * g.L, g, patches()).Rout * s.h / g.L; drawRollBody(s.x + s.w / 2, yb, R, s.w + 10, [{ a: 0, b: 1, off: 0 }]); }
  // циновка-ручка
  const h = L.handle; rr(h.x, h.y, h.w, h.h, 10); ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fill();
  ctx.fillStyle = 'rgba(40,30,20,0.55)'; ctx.font = font(13, 600); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p > 0 ? 'ещё… ↑' : '↑ потяни циновку вверх — скрутить', h.x + h.w / 2, h.y + h.h / 2);
  // предпросмотр среза (инструмент владельца) — над листом
  if (S.preview) {
    const size = 116, img = face(0.5, size), x = W / 2 - 30, y = L.previewY;
    drawFaceImg(img, x, y, size);
    ctx.fillStyle = '#b8ad95'; ctx.font = font(11); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('живой срез', x + size / 2 + 14, y - 8); ctx.fillText(`${windFor(0.5).turns.toFixed(1).replace('.', ',')} витка`, x + size / 2 + 14, y + 8);
  }

  if (sel && p === 0) {
    const canWrap = sel.kind !== 'nori' && !ING[sel.kind].wave;
    buttonRow(canWrap ? [['wrap', 'Обернуть нори', true, 1.6], ['remove', 'Убрать'], ['deselect', '✕', false, 0.5]] : [['remove', 'Убрать'], ['deselect', '✕', false, 0.5]]);

function rollDims() { const m = getModel(), s = L.sheet; const k = L.roll.len / s.w; return { g: m.g, R: m.Rmax * s.h / m.g.L * k, len: L.roll.len }; }
function drawBoard(R, len, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; drawMat(L.roll.x - len / 2 - 26, L.roll.y - R - 36, len + 52, 2 * R + 72); ctx.restore();
}
function drawRolled() {
  const { R, len } = rollDims();
  drawBoard(R, len);
  drawRollBody(L.roll.x, L.roll.y, R, len, [{ a: 0, b: 1, off: 0 }]);
  // риски: где будут резы
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.setLineDash([3, 5]); ctx.lineWidth = 1;

// Ритуал реза: t — прогресс 0..1 (850 мс), потом zoom (0..1, 500 мс).
let cut = null;
function startCut(v) {
  const { R, len } = rollDims();
  const img = face(v, Math.max(L.faceSize, 2 * R));   // считаем срез заранее, до начала анимации
  cut = { v, x: L.roll.x - len / 2 + v * len, t0: performance.now(), dur: 850, zoom: 0, img, R, len, sounded: false, particled: false };

function drawCut(now) {

}
function drawRevealed() {

  drawFaceImg(c.img, W / 2, L.faceY, L.faceSize);
  ctx.fillStyle = '#8d846f'; ctx.font = font(12); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(`срез на ${Math.round(c.v * 100)} % длины`, W / 2, L.faceY + L.faceSize / 2 + 14);
  buttons = []; buttonRow([['slice', `Нарезать на ${NPIECES}`, true], ['back', 'Ещё начинки'], ['new', 'Новый лист']]);
  drawButtons(); drawTopBar(hints.revealed);

// Нарезка: быстрые удары, потом кусочки встают срезом и разъезжаются по тарелке.
let slicing = null;
function startSlicing() {
  const { R, len } = rollDims();
  const cutsV = []; for (let i = 1; i < NPIECES; i++) if (Math.abs(i / NPIECES - cut.v) > 1e-3) cutsV.push(i / NPIECES);
  const imgs = []; for (let i = 0; i < NPIECES; i++) imgs.push(face(pieceV(i), L.grid[0].size));

function drawSlicing(now) {
  const s = slicing, el = now - s.t0, chopsEnd = s.cutsV.length * s.chop;
  const reveal = remap(el, chopsEnd + 60, chopsEnd + 460), move = easeInOutCubic(remap(el, chopsEnd + 420, chopsEnd + 980));

  }
  buttons = []; buttonRow([['back', 'Ещё начинки', true], ['new', 'Новый лист']]);
  drawButtons(); drawTopBar(hints.plate);
  if (S.bigPiece >= 0) {
    ctx.fillStyle = 'rgba(23,23,19,0.85)'; ctx.fillRect(0, 0, W, H);
    const img = face(pieceV(S.bigPiece), L.faceSize);

    ctx.fillStyle = '#b8ad95'; ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'top';

// ---------------------------------------------------------------- цикл отрисовки
let rafId = 0, lastNow = 0;
function frame(now) {
  rafId = 0; lastNow = now; dirty = false;

  let animating = false;

    case 'lay': drawLay(); animating = !!anim; break;
    case 'rolled': drawRolled(); break;
    case 'cut': drawCut(now); animating = S.mode === 'cut'; break;
    case 'revealed': drawRevealed(); break;
    case 'slicing': drawSlicing(now); animating = S.mode === 'slicing'; break;
    case 'plate': drawPlate(); break;
  }

function requestFrame() { if (!rafId) rafId = requestAnimationFrame(frame); }
let anim = null;   // одноразовая анимация (доскрутка / откат циновки)
function tween(from, to, dur, apply, done) {

// ---------------------------------------------------------------- ввод
const drag = { id: null, kind: null, x0: 0, y0: 0, patch: null, ou: 0, ov: 0, moved: false, p0: 0, lastY: 0, lastT: 0 };
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function sheetUV(x, y) { const s = L.sheet; return { u: 1 - (y - s.y) / s.h, v: (x - s.x) / s.w }; }
function hitPatch(x, y) {
  const list = patches();
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i], d = ING[p.kind], r = patchRect(p);
    if (d.wave) { r.y -= d.wave.amp * L.sheet.h; r.h += 2 * d.wave.amp * L.sheet.h; }

}
function placeAt(u, v) {

}
// «Обернуть нори»: четыре настоящих патча вокруг начинки — под, над и два торца.
function wrapInNori(F) {
  const list = patches(), i = list.indexOf(F); if (i < 0) return;
  const m = dims(F), b = B(), dF = ING[F.kind], wF = F.wU ?? dF.wU, hF = F.hU ?? dF.hU, hN = ING.nori.hU, capW = 0.6;
  const mk = (u, wU, hU) => ({ kind: 'nori', u, v: F.v, wU, dv: m.dv, hU, z0: 0, z1: 0, phase: Math.random() * TAU });
  list.splice(i, 0, mk(F.u, wF, hN));            // под начинкой (раньше в стопке — ниже)
  list.splice(i + 2, 0, mk(F.u, wF, hN));        // над начинкой
  list.push(mk(F.u - m.du / 2 - capW / (2 * b.L), capW, hF + 2 * hN), mk(F.u + m.du / 2 + capW / (2 * b.L), capW, hF + 2 * hN)); // торцы

}
function action(id) {

function onDown(x, y, id) {

function onMove(x, y, id) {

    if (!drag.moved) return;

function onUp(x, y, id) {

    else { if (drag.outside) { const l = patches(); l.splice(l.indexOf(p), 1); S.selPatch = null; } touchModel(); }

canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (drag.id !== null && drag.id !== e.pointerId) return; canvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY, e.pointerId); });
canvas.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.clientX, e.clientY, e.pointerId); });
canvas.addEventListener('pointerup', e => { e.preventDefault(); onUp(e.clientX, e.clientY, e.pointerId); });
canvas.addEventListener('pointercancel', e => { onUp(e.clientX, e.clientY, e.pointerId); });
window.addEventListener('keydown', e => {
  if (e.key === 'Backspace') action('undo');
  else if (e.key === 'Escape') action('back');
  else if (e.key === 'Enter') { if (S.mode === 'lay' && !anim) tween(S.rollP, 1, 500, v => { S.rollP = v; }, () => { S.mode = 'rolled'; S.rollP = 0; dirty = true; }); else if (S.mode === 'rolled') { startCut(0.5); requestFrame(); } else if (S.mode === 'revealed') action('slice'); }

window.addEventListener('resize', () => { resize(); requestFrame(); });
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); requestFrame(); }, 120));

load(); resize(); touchModel(); requestFrame();
</script>
