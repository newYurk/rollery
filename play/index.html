<meta name="rollery-v" content="1">
<script>
/* ⚑ МАЯК ВЕРСИИ (#144). Маркер ?v= в ссылке лечит страницу, НА КОТОРУЮ ссылаются: адрес
   меняется — браузер обязан сходить за файлом. Точку входа он не лечит в принципе: её
   адрес набирают или держат в закладке, ссылки на неё нет. Свои заголовки на GitHub Pages
   не задать — CDN отдаёт cache-control: max-age=600. 05.09 так и вышло: карточка «Срез V2»
   уехала в репозиторий, а на телефоне владельца её не было, и понять это было нечем.

   Маяк идёт за ЭТОЙ ЖЕ страницей мимо кэша и сверяет версию. Он НЕ перезагружает сам:
   молчаливая перезагрузка увела бы игрока с середины раскладки, а зациклиться она могла бы,
   пока CDN держит старую копию. Он показывает полосу — жмёт человек.

   Код встроен, а не вынесен в файл: вынесенный чинильщик кэша сам приезжает из кэша.
   Версия берётся из самой страницы, а не из отдельного version.txt, — иначе появляется
   второй источник правды, который забудут поднять ровно тогда, когда маяк нужен. */
(function () {
  var meta = document.querySelector('meta[name="rollery-v"]');
  if (!meta || !window.fetch) return;
  var своя = meta.content;
  fetch(location.pathname + '?beacon=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      var m = t && t.match(/name="rollery-v" content="([^"]+)"/);
      if (!m || m[1] === своя) return;
      var bar = document.createElement('div');
      bar.textContent = 'Свежая версия ' + m[1] + ' · у вас ' + своя + ' — обновить';
      bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:12px;' +
        'font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;' +
        'cursor:pointer;background:#e0b25f;color:#171713;border-top:2px solid #171713';
      bar.onclick = function () { location.href = location.pathname + '?v=' + m[1]; };
      (document.body || document.documentElement).appendChild(bar);
    })
    .catch(function () {});
})();
</script>

<!-- Модель разрезана на файлы 29.08.2026. Порядок ОБЯЗАТЕЛЕН: classic scripts делят

<!-- Раскладка игрока → RecipeV2. Единственное место, где S/ING/BASES встречаются с ядром V2. -->

<script>
'use strict';
// =====================================================================
//  Ролльня — стенд «лист → спираль → срез».
//  Одна модель на всё: плоский лист в координатах (u, v, z).
//    u — направление скрутки: 0 — ближний край (окажется в центре ролла), 1 — дальний (снаружи).
//    v — вдоль оси ролла: какой ломтик.
//    z — слой по толщине намазки: 0 — на обёртке, 1 — верх намазки (внутренняя сторона витка).
//  Начинка — прямоугольный патч на листе с интервалом по z. Стопка вдавливается в намазку сверху
//  (рис под ней сжат с коэффициентом κ): лист скручивается верхом внутрь, поэтому положенное
//  ПОВЕРХ (последним) оказывается ближе к центру ролла, положенное первым — дальше от центра.
//  Скрутка — намотка листа ПЕРЕМЕННОЙ толщины: лист режется на угловые бины и наматывается виток
//  за витком; где стопка толще намазки — слой толще, рис под начинкой выдавлен, ролл бугрится.
//  Единица длины — толщина намазки суши-ролла (≈5 мм); размеры начинок заданы в этих единицах.
//  Срез — попиксельная развёртка: пиксель (r, φ) → виток k → (u, z) → материал.
// =====================================================================


// ---------------------------------------------------------------- цикл отрисовки
let rafId = 0, lastNow = 0;
function frame(now) {
  rafId = 0; lastNow = now; dirty = false; icons = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#171713'; ctx.fillRect(0, 0, W, H);
  let animating = false;
  switch (S.mode) {
    case 'lay': drawLay(); animating = !!anim; break;
    case 'rolled': drawRolled(); break;
    case 'cut': drawCut(now); animating = S.mode === 'cut'; break;
    case 'revealed': drawRevealed(); break;
    case 'slicing': drawSlicing(now); animating = S.mode === 'slicing'; break;
    case 'plate': drawPlate(); break;
    case 'album': drawAlbum(); break;
  }
  if (anim) { animating = true; anim(now); }
  if (particles.length || shakeUntil > now) animating = true;
  if (animating || dirty) requestFrame();
}
function requestFrame() { if (!rafId) rafId = requestAnimationFrame(frame); }
let anim = null;   // одноразовая анимация (доскрутка / откат циновки)
function tween(from, to, dur, apply, done) {
  const t0 = performance.now();
  anim = now => { const t = easeOutCubic(clamp((now - t0) / dur)); apply(lerp(from, to, t)); if (t >= 1) { anim = null; if (done) done(); } dirty = true; };
  requestFrame();
}

// ---------------------------------------------------------------- ввод
const drag = { id: null, kind: null, x0: 0, y0: 0, patch: null, ou: 0, ov: 0, moved: false, p0: 0, lastX: 0, lastY: 0, lastT: 0 };
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
// Единственная точка перевода «экран → доли листа». Сначала toSheet (снимает поворот листа,
// если тот лежит боком, #23), дальше прежняя формула в логическом пространстве SB.
function sheetUV(x, y) { const q = toSheet(x, y), s = SB(); return { u: 1 - (q.y - s.y) / s.h, v: (q.x - s.x) / s.w }; }
// Ореол вокруг патча — HIT_PAD, и он же стоит в формуле пола листа (sheetFloor): это ОДНО число,
// а не два похожих. Было 10, стало 14. Причина: пока лист был полулистом хосомаки (L = 21),
// брусок в 2 единицы занимал 0,095 высоты и 10 px ореола хватало. На едином листе (L = 42)
// та же начинка — 0,048 высоты, на 390x844 это 16,8 px, и цель касания выходила 36,8 при норме 44.
// Плата названа честно: соседние бруски на экране в ~20 px, ореолы перекрываются на ~8 px;
// перебор идёт с конца списка, поэтому выигрывает верхний — разрешается детерминированно,
// но соседа под стопкой схватить можно.
function hitPatch(x, y) {
  // patchRect/patchScreen отвечают в ЛОГИЧЕСКОМ пространстве листа — переводим точку касания
  // туда же (toSheet — чистый поворот, поэтому HIT_PAD в пикселях остаётся честным ореолом).
  const q = toSheet(x, y); x = q.x; y = q.y;
  const list = patches();
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i], d = ING[p.kind];
    if (p.rot) { const t = patchScreen(p), dx = x - t.cx, dy = y - t.cy, c = Math.cos(t.ang), sn = Math.sin(t.ang); const ax = dx * c + dy * sn, ay = -dx * sn + dy * c; if (Math.abs(ax) <= t.lenPx / 2 + HIT_PAD && Math.abs(ay) <= t.wPx / 2 + HIT_PAD) return p; continue; }
    const r = patchRect(p);
    if (d.wave) { r.y -= d.wave.amp * SB().h; r.h += 2 * d.wave.amp * SB().h; }
    const pad = HIT_PAD; if (x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - pad && y <= r.y + r.h + pad) return p;
  }
  return null;
}
function placeAt(u, v) {
  const d = ING[S.sel], m = dims({ kind: S.sel });
  const p = { kind: S.sel, u: clamp(u, m.du / 2 + (d.wave ? d.wave.amp : 0), 1 - m.du / 2 - (d.wave ? d.wave.amp : 0)), v: clamp(v, m.dv / 2, 1 - m.dv / 2), z0: 0, z1: m.h, phase: Math.random() * TAU };
  patches().push(p); S.selPatch = null; touchModel(); sfx.place();
}
// «Обернуть нори»: четыре настоящих патча вокруг начинки — под, над и два торца.
// ⚠ ЭТО НЕ КОНВЕРТ, А ЧЕТЫРЕ ПЛАШКИ. Помечено 31.08.2026 по замечанию владельца: «если
// выбрать кусок, лежащий на татами, и обернуть его в нори, оборачивается не так».
//
// Что здесь на самом деле: под кусок кладётся плашка нори, над куском вторая, и с торцов
// две узкие (capW = 0,3). Четыре независимых прямоугольника. Отсюда всё, что видно на срезе:
//   · по углам они НЕ СХОДЯТСЯ — между плашкой и торцом остаётся щель, и рис в неё заходит;
//   · круглый кусок (креветка, авокадо-полумесяц) оборачивается как прямоугольный, потому
//     что профиль куска здесь не спрашивается вовсе;
//   · модель не знает, что кусок обёрнут: она видит начинку и рядом четыре куска нори.
//     Поэтому канон, ядро и карта материалов считают их отдельными телами.
//
// И это не то же самое, что нори-обёртка ролла. Обёртка ролла — база (WRAPPERS, S.wrap).
// Здесь — нори ВНУТРИ ролла, вокруг отдельного куска: приём настоящий (так собирают
// 鳴門巻き и элементы 飾り巻き寿司), но у него своя геометрия, и её надо расписать (#115).
//
// До тех пор действие оставлено в интерфейсе под честной подписью «Кусок в нори», но из
// генератора целей пазла убрано: строить задание на примитиве, который считается неверно,
// значит закладывать ошибку в то, что игрок обязан повторить.
// ОБЁРТКА КУСКА — ОДИН ФЛАГ, А НЕ ЧЕТЫРЕ ПЛАШКИ (issue #115, решение владельца 01.09).
//
// Здесь собиралась обёртка из четырёх независимых патчей: один под куском, один над и два
// торцевых фиксированной ширины 0,3. Отсюда шло всё, что было видно: по углам плашки не
// сходились и рис затекал в щели; профиль куска не спрашивался вовсе, так что круглая
// креветка оборачивалась как прямоугольник; а модель видела не обёрнутый кусок, а начинку и
// рядом четыре отдельных тела — поэтому канон, площадь ядра и сравнение в пазле считали их
// порознь. Механика вдобавок жила в файле связывания, а не в модели.
//
// Теперь обёртка — свойство самого куска. Габарит растёт на толщину нори (dims), оболочка
// рисуется по ТОМУ ЖЕ профилю (matAt), поэтому сходится по углам по построению и повторяет
// форму: полукруг оборачивается полукругом.
function wrapInNoriList(F, list) {
  if (list.indexOf(F) < 0) return;
  F.noriWrap = true;
}
function wrapInNori(F) { wrapInNoriList(F, patches()); S.selPatch = null; touchModel(); sfx.place(); }

canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (drag.id !== null && drag.id !== e.pointerId) return; canvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY, e.pointerId); });
canvas.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.clientX, e.clientY, e.pointerId); });
canvas.addEventListener('pointerup', e => { e.preventDefault(); onUp(e.clientX, e.clientY, e.pointerId); });
canvas.addEventListener('pointercancel', e => { onUp(e.clientX, e.clientY, e.pointerId); });
window.addEventListener('keydown', e => {
  // Ctrl/⌘+Z — отмена, с Shift — возврат: привычная пара, раз история теперь настоящая (#84).
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); action(e.shiftKey ? 'redo' : 'undo'); }
  else if (e.key === 'Backspace') action('undo');
  else if (e.key === 'Escape') action('back');
  // L — ОТЛАДОЧНЫЕ КОНТУРЫ поверх любой графики (идея владельца 31.08). Контур берётся из
  // координат МОДЕЛИ, а не из того, что нарисовал рендер, поэтому годится как эталон для
  // любого стиля: видно, где арт разошёлся с моделью. Не сохраняется между запусками.
  else if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') {
    S.lines = !S.lines; dirty = true; requestFrame();
  }
  else if (e.key === 'Enter') { if (S.mode === 'lay' && !anim) { S.hand = { air: 0, wobble: 0, phase: 0, press: 1, v: 1, cv: 0, hold: 0 }; } if (S.mode === 'lay' && !anim) tween(S.rollP, 1, 500, v => { S.rollP = v; }, () => { S.mode = 'rolled'; S.rollP = 0; dirty = true; }); else if (S.mode === 'rolled') { startCut(0.5); requestFrame(); } else if (S.mode === 'revealed') action('slice'); }
});
window.addEventListener('resize', () => { resize(); requestFrame(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { resize(); requestFrame(); });
window.addEventListener('pageshow', () => { resize(); requestFrame(); });
setTimeout(() => { resize(); requestFrame(); }, 300); setTimeout(() => { resize(); requestFrame(); }, 1200);
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); requestFrame(); }, 120));

load(); resize(); touchModel(); sfx.armStart();
// Заготовки открываются сразу скрученными — править в них нечего.
// Своя раскладка (голый ?v2) начинается там же, где обычная игра: на листе.
if (S.v2 && S.v2Scenario !== 'layout') { S.mode = 'rolled'; S.base = 'hoso'; }
const linked = decodePuzzle(location.hash);
if (linked) puzzleFromLink(linked); else if (location.search.includes('puzzle')) action('puzzle');
window.addEventListener('hashchange', () => { const pz = decodePuzzle(location.hash); if (pz) puzzleFromLink(pz); });
requestFrame();
</script>
<!-- Регрессионная проверка: play/index.html?check — грузится только по требованию -->
<!-- СТОРОЖ ТОЖЕ КЕШИРУЕТСЯ. Без строки запроса браузер отдавал checks.js из кеша, и прогон молча
     проверял СТАРЫМ сторожем: 28.08 правка проверки не применилась, а результат выглядел настоящим.
     Та же семья, что «проверка мерила по старому ореолу 10 px». Версия пробрасывается из адреса. -->
<!-- Проверочный путь грузит и модули inverse: сверка их каталога с живым ING обязана идти
     в общей регрессии, иначе продублированные там числа разойдутся с игрой молча.
     Порядок важен — checks.js последним, он на них ссылается. Загрузка последовательная:
     параллельная не гарантирует порядок выполнения. -->
<script>if(location.search.indexOf('check')>=0){
  (async () => { for (const f of ['inverse/primitives.js','inverse/materials.js',
      'test/fixtures/fixtures.js','test/probe.js','test/practice.js','test/legacy/baseline.js',
      'test/legacy/baseline-data.js','test/domain/roll-facade-checks.js','checks.js'])
    await new Promise(r => { const t=document.createElement('script'); t.src=f+location.search; t.onload=r; t.onerror=r; document.head.appendChild(t); }); })();
}</script>
