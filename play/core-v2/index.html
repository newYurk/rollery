<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ролльня · срез V2</title>
<style>
  :root {
    --bg: #171713;
    --ink: #f3e7ca;
    --dim: #9a9280;
    --line: #2b2a22;
    --hot: #e0b25f;
    --surface: #1d1c17;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  header { max-width: 920px; margin: 0 auto 18px; width: 100%; }
  h1 { font-size: clamp(18px, 4vw, 24px); letter-spacing: .08em; font-weight: 600; margin: 0 0 .2em; }
  .sub { color: var(--dim); font-size: 13px; }
  .stage {
    max-width: 920px; margin: 0 auto; width: 100%;
    display: grid; grid-template-columns: 1fr; gap: 16px;
  }
  @media (min-width: 860px) {
    .stage { grid-template-columns: 1.15fr .85fr; align-items: start; }
  }
  .frame {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  #slice { aspect-ratio: 1; }
  #sheet { height: 84px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  button.chip {
    appearance: none; cursor: pointer;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 13px;
  }
  button.chip[aria-pressed="true"] {
    color: var(--bg); background: var(--hot); border-color: var(--hot);
  }
  button.chip:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .meta { color: var(--dim); font-size: 12.5px; display: grid; gap: 6px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .ok { color: #b7c59a; }
  .no { color: #c4a27a; }
  label.slider { display: grid; gap: 6px; color: var(--dim); font-size: 12.5px; margin-top: 12px; }
  input[type=range] { width: 100%; accent-color: var(--hot); }
  .refuse {
    min-height: 280px; display: flex; align-items: center; justify-content: center;
    color: var(--dim); text-align: center; padding: 24px; line-height: 1.6;
  }
</style>
</head>
<body>
  <header>
    <h1>СРЕЗ V2</h1>
    <p class="sub">Ядро в миллиметрах. Не стенд игры — отдельный debug после F01–F07.</p>
  </header>
  <div class="stage">
    <div class="frame">
      <canvas id="slice" width="720" height="720"></canvas>
      <div id="refuse" class="refuse" hidden></div>
      <canvas id="sheet" width="720" height="84"></canvas>
    </div>
    <div>
      <div class="chips" id="chips"></div>
      <div class="meta" id="meta"></div>
      <label class="slider" id="sliderWrap" hidden>
        <span id="sliderLabel"></span>
        <input id="slider" type="range" min="20" max="80" step="0.5">
      </label>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
