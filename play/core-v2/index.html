<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ролльня · срез V2</title>
<style>
  :root {
    --bg: #171713;
    --ink: #f3e7ca;
    --dim: #9a9280;
    --line: #2b2a22;
    --hot: #e0b25f;
    --surface: #1d1c17;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; height: 100dvh;
    background: var(--bg); color: var(--ink);
    font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column;
    padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
  }
  .view {
    flex: 1 1 auto; min-height: 0;
    display: grid; place-items: center;
  }
  #slice {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
  }
  .refuse {
    max-width: 22em; color: var(--dim); text-align: center; line-height: 1.5;
  }
  .dock {
    flex: 0 0 auto;
    display: flex; flex-direction: column; gap: 6px;
    padding-top: 6px;
  }
  .chips {
    display: flex; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  button.chip, button.cut {
    appearance: none; cursor: pointer; flex: 0 0 auto;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; font: inherit; font-size: 12px;
    min-height: 36px;
  }
  button.chip[aria-pressed="true"], button.cut {
    color: var(--bg); background: var(--hot); border-color: var(--hot);
  }
  button.cut:disabled { opacity: 0.35; cursor: default; }
  button.chip:focus-visible, button.cut:focus-visible {
    outline: 2px solid var(--hot); outline-offset: 2px;
  }
  .meta {
    color: var(--dim); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta b { color: var(--ink); font-weight: 600; }
  .ok { color: #b7c59a; }
  .no { color: #c4a27a; }
  label.slider {
    display: grid; gap: 2px; color: var(--dim); font-size: 11px;
  }
  input[type=range] { width: 100%; accent-color: var(--hot); height: 22px; margin: 0; }
  #bar { width: 100%; height: 100px; display: block; touch-action: none; cursor: ew-resize; border-radius: 6px; }
</style>
</head>
<body>
  <div class="view">
    <canvas id="slice" width="720" height="720"></canvas>
    <div id="refuse" class="refuse" hidden></div>
  </div>
  <div class="dock">
    <div class="chips" id="chips"></div>
    <div class="meta" id="meta"></div>
    <label class="slider" id="sliderWrap" hidden>
      <span id="sliderLabel"></span>
      <input id="slider" type="range" min="20" max="80" step="0.5">
    </label>
    <canvas id="bar" width="720" height="110"></canvas>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
