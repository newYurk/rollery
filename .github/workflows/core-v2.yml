name: core-v2

on:
  pull_request:
  push:
    branches: [main, 'core-v2/**']
    paths:
      - 'play/core-v2/**'
      - '.github/workflows/core-v2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: fixtures
        run: node play/core-v2/run-fixtures.mjs

      # Отчёты собраны на машине автора, а этот шаг идёт на ubuntu x64. Если они
      # сходятся — переносимость доказана железом, а не обещанием. Раньше шаг был
      # невозможен: Math.cos/Math.sin расходятся в последнем бите, и дифф краснел
      # на любой другой платформе. Хеши и тело отчёта лежат на сетке 1e-6 мм (#175).
      - name: reports are portable and current
        run: git diff --exit-code play/core-v2/reports
      - name: unit
        run: node --test play/core-v2/core-v2.test.mjs
